  short_description: "광고는 인스타 우선·Meta 보조, 사진 연출은 Pinterest 6장"
  default_prompt: "$chany-reference-board로 이 제품에 맞는 레퍼런스를 Pinterest 6장 대화에 바로 보여줘. 같은 카테고리 안 재검색과 후보 교체는 자동 진행하고 추천 방향을 정리해줘. 내가 사이트나 장수를 지정하면 그 요청을 따라줘."
policy:
  allow_implicit_invocation: true
