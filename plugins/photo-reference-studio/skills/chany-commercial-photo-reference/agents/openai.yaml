interface:
  display_name: "Chany Commercial Photo Reference"
  short_description: "Production Paradise 상업사진 레퍼런스 보드"
  default_prompt: "$chany-commercial-photo-reference로 Production Paradise에서 업종 L1을 먼저 검색하고 필요한 경우 직접 L2 하나까지만 사용해 상업사진 레퍼런스를 기본 6장, 내가 지정한 경우 그 수량만큼 현재 대화에 보여줘."
policy:
  allow_implicit_invocation: true
