interface:
  display_name: "AI Photo Reference Studio"
  short_description: "원본을 보존한 키비주얼·상세페이지·광고소재 제작"
  default_prompt: "$auto-photo-production으로 첨부 원본과 승인 문구를 잠그고 Behance·Pinterest 레퍼런스 6장을 링크나 HTML이 아닌 현재 대화의 실제 이미지로 보여준 뒤, 선택한 방향으로 키비주얼·상세페이지·광고소재를 같은 캠페인 톤으로 만들어줘."
dependencies:
  tools:
    - type: "mcp"
      value: "higgsfield"
      description: "Upload source media, preserve source pixels with background removal, and create reference-directed images"
      transport: "streamable_http"
      url: "https://mcp.higgsfield.ai/mcp"
policy:
  allow_implicit_invocation: true
