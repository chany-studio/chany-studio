interface:
  display_name: "AI Photo Reference Studio"
  short_description: "원본을 보존한 키비주얼·상세페이지·광고소재 제작"
  default_prompt: "$auto-photo-production으로 이 원본을 분석하고 Behance·Pinterest 레퍼런스를 이미지로 보여준 뒤, 정체성을 보존한 키비주얼과 커머스 이미지 세트를 만들어줘."
dependencies:
  tools:
    - type: "mcp"
      value: "higgsfield"
      description: "Upload source media, preserve source pixels with background removal, and create reference-directed images"
      transport: "streamable_http"
      url: "https://mcp.higgsfield.ai/mcp"
policy:
  allow_implicit_invocation: true
