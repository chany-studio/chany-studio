interface:
  display_name: "Chany's Detail Page"
  short_description: "사실 기반의 일관된 상품 상세페이지 이미지 모듈 제작"
  default_prompt: "$chany-detail-page로 이 제품의 히어로, 핵심 특징, 디테일, 사용 장면과 마감 CTA 모듈을 같은 캠페인 톤으로 구성해줘."
dependencies:
  tools:
    - type: "mcp"
      value: "higgsfield"
      description: "Create source-faithful product and lifestyle imagery for detail-page modules"
      transport: "streamable_http"
      url: "https://mcp.higgsfield.ai/mcp"
policy:
  allow_implicit_invocation: true
