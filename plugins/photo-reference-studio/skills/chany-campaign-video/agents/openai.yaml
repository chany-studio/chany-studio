interface:
  display_name: "Chany's Campaign Video"
  short_description: "제품·서비스 광고 영상 기획·제작과 기존 영상의 AI 부분 편집"
  default_prompt: "$chany-campaign-video로 콘텐츠 목적과 원본을 확인하고, 새 광고 영상 제작 또는 기존 영상의 필요한 부분만 수정하는 경로를 추천해줘. 유료 실행 전 비용과 범위를 확인해줘."
dependencies:
  tools:
    - type: "mcp"
      value: "higgsfield"
      description: "Create video and related media exposed by the active Higgsfield connection"
      transport: "streamable_http"
      url: "https://mcp.higgsfield.ai/mcp"
policy:
  allow_implicit_invocation: true
